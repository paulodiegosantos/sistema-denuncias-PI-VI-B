
{% extends 'denuncie/base.html' %}

{% block title %}Acesso administrativo{% endblock %}

{% block content %}
<h1>Acesso administrativo</h1>

<p>Entre com suas credenciais para gerenciar as denúncias.</p>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Usuário</label>
    <input type="text" name="username" required>

    <label>Senha</label>
    <input type="password" name="password" required>

    <button type="submit">Entrar</button>
</form>
{% endblock %}
