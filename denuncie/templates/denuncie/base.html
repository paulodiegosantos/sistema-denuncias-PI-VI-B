
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Canal Seguro de Denúncias{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #263238;
        }
        header {
            background: #16324f;
            color: white;
            padding: 22px 8%;
        }
        header a { color: white; text-decoration: none; }
        nav { margin-top: 12px; }
        nav a { margin-right: 20px; }
        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }
        h1, h2 { color: #16324f; }
        button, .botao {
            display: inline-block;
            background: #176b55;
            color: white;
            padding: 12px 20px;
            border: 0;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="checkbox"] { width: auto; }
        label { font-weight: bold; }
        .erro { color: #b42318; }
        .destaque {
            background: #edf4f8;
            padding: 18px;
            border-radius: 6px;
            margin: 20px 0;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #667;
        }
    </style>
</head>
<body>

<header>
    <h2><a href="{% url 'inicio' %}">Canal Seguro de Denúncias</a></h2>
    <p>Um ambiente para relatar irregularidades com confidencialidade.</p>
    <nav>
        <a href="{% url 'inicio' %}">Início</a>
        <a href="{% url 'registrar' %}">Registrar denúncia</a>
        <a href="{% url 'acompanhar' %}">Acompanhar</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    Sistema acadêmico de denúncias | Projeto Integrador 6B
</footer>

</body>
</html>
